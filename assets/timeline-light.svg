<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="400" viewBox="0 0 1200 400" role="img" aria-label="Career timeline: from courseware to agents, eight milestones from 2012 to 2026, from instructional designer to AI and software architect">
<title>From courseware to agents — career timeline 2012 to 2026</title>
<defs>
<filter id="blur" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="80"/></filter>
<filter id="shadow" x="-10%" y="-20%" width="120%" height="150%"><feDropShadow dx="0" dy="14" stdDeviation="20" flood-color="#000000" flood-opacity=".12"/></filter>
<filter id="bloom" x="-10%" y="-20%" width="120%" height="140%"><feGaussianBlur stdDeviation="6"/></filter>
<filter id="nodeglow" x="-200%" y="-200%" width="500%" height="500%"><feDropShadow dx="0" dy="0" stdDeviation="6" flood-color="#BF8700" flood-opacity=".6"/></filter>
<linearGradient id="depth" x1="0" y1="0" x2="0" y2="0.4"><stop offset="0" stop-color="#FFFFFF" stop-opacity=".10"/><stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/></linearGradient>
<linearGradient id="rim" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FFFFFF" stop-opacity=".85"/><stop offset="1" stop-color="#FFFFFF" stop-opacity=".25"/></linearGradient>
<linearGradient id="ring" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#4F46E5" stop-opacity=".9"/><stop offset="1" stop-color="#9A6700" stop-opacity=".9"/></linearGradient>
<clipPath id="tile"><rect x="0" y="0" width="1200" height="400" rx="28"/></clipPath>
</defs>
<style>text{font-family:-apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "Helvetica Neue", "Segoe UI", Inter, Arial, sans-serif;}.bi,.ba,.run,.pul,.node,.ln{transform-box:fill-box;transform-origin:center;}.bi{animation:drift1 26s ease-in-out infinite alternate;}.ba{animation:drift2 30s ease-in-out -9s infinite alternate;}.run{stroke-dasharray:90 2471.84;stroke-dashoffset:90;animation:run 9s linear infinite;}.pul{animation:pulse 2.8s ease-out 1.76s infinite;opacity:0;}.node{animation:pop .5s ease-out both;}.n0{animation-delay:0.0s}.n1{animation-delay:0.18s}.n2{animation-delay:0.36s}.n3{animation-delay:0.54s}.n4{animation-delay:0.72s}.n5{animation-delay:0.9s}.n6{animation-delay:1.08s}.n7{animation-delay:1.26s}.ln{stroke-dasharray:855;stroke-dashoffset:855;animation:draw 2s ease-out both;}@keyframes drift1{from{transform:translate(0,0)}to{transform:translate(48px,36px)}}@keyframes drift2{from{transform:translate(0,0)}to{transform:translate(-52px,-40px)}}@keyframes run{from{stroke-dashoffset:90}to{stroke-dashoffset:-2561.84}}@keyframes pulse{0%{transform:scale(1);opacity:.7}100%{transform:scale(2.4);opacity:0}}@keyframes pop{from{transform:scale(0)}to{transform:scale(1)}}@keyframes draw{to{stroke-dashoffset:0}}@media (prefers-reduced-motion: reduce){*{animation:none !important;}.ln{stroke-dashoffset:0 !important;}}</style>
<rect x="0.5" y="0.5" width="1199" height="399" rx="28" fill="#FFFFFF" stroke="#D0D7DE" stroke-width="1"/>
<g clip-path="url(#tile)">
<g filter="url(#blur)">
<circle class="bi" cx="220" cy="110" r="330" fill="#312E81" fill-opacity=".30"/>
<circle class="ba" cx="1040" cy="400" r="300" fill="#BF8700" fill-opacity=".30"/>
</g></g>
<text x="600" y="78" text-anchor="middle" font-size="48" font-weight="600" letter-spacing="-1.2" fill="#1F2328">From courseware to agents.</text>
<text x="600" y="116" text-anchor="middle" font-size="21" font-weight="400" fill="#59636E">Fourteen years, one thread — 2012 to 2026.</text>
<rect x="80" y="148" width="1040" height="220" rx="28" fill="#F6F8FA" fill-opacity=".62" filter="url(#shadow)"/>
<rect x="80" y="148" width="1040" height="220" rx="28" fill="url(#depth)"/>
<rect x="80" y="148" width="1040" height="220" rx="28" fill="none" stroke="url(#ring)" stroke-width="6" stroke-opacity=".18" filter="url(#bloom)"/>
<rect x="80" y="148" width="1040" height="220" rx="28" fill="none" stroke="url(#ring)" stroke-width="1.75"/>
<rect class="run" x="80" y="148" width="1040" height="220" rx="28" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-opacity=".9" stroke-linecap="round"/>
<line class="ln" x1="160" y1="262" x2="1015" y2="262" stroke="#6E7781" stroke-opacity=".45" stroke-width="2" stroke-linecap="round"/>
<circle class="node n0" cx="190.0" cy="262" r="7" fill="#4F46E5"/>
<text x="190.0" y="196" text-anchor="middle" font-size="20" font-weight="600" fill="#4F46E5">2012</text>
<text x="190.0" y="221" text-anchor="middle" font-size="18" font-weight="500" fill="#1F2328">Instructional</text>
<text x="190.0" y="244" text-anchor="middle" font-size="18" font-weight="400" fill="#59636E">Designer</text>
<circle class="node n1" cx="303.6" cy="262" r="7" fill="#4F46E5"/>
<text x="303.6" y="294" text-anchor="middle" font-size="20" font-weight="600" fill="#4F46E5">2014</text>
<text x="303.6" y="319" text-anchor="middle" font-size="18" font-weight="500" fill="#1F2328">Production</text>
<text x="303.6" y="342" text-anchor="middle" font-size="18" font-weight="400" fill="#59636E">Executive</text>
<circle class="node n2" cx="417.1" cy="262" r="7" fill="#4F46E5"/>
<text x="417.1" y="196" text-anchor="middle" font-size="20" font-weight="600" fill="#4F46E5">2017</text>
<text x="417.1" y="221" text-anchor="middle" font-size="18" font-weight="500" fill="#1F2328">Candela Learning</text>
<text x="417.1" y="244" text-anchor="middle" font-size="18" font-weight="400" fill="#59636E">begins</text>
<circle class="node n3" cx="530.7" cy="262" r="7" fill="#4F46E5"/>
<text x="530.7" y="294" text-anchor="middle" font-size="20" font-weight="600" fill="#4F46E5">2021</text>
<text x="530.7" y="319" text-anchor="middle" font-size="18" font-weight="500" fill="#1F2328">PPM Workflow</text>
<text x="530.7" y="342" text-anchor="middle" font-size="18" font-weight="400" fill="#59636E">architect</text>
<circle class="node n4" cx="644.3" cy="262" r="7" fill="#4F46E5"/>
<text x="644.3" y="196" text-anchor="middle" font-size="20" font-weight="600" fill="#4F46E5">2023</text>
<text x="644.3" y="221" text-anchor="middle" font-size="18" font-weight="500" fill="#1F2328">RangeXT</text>
<text x="644.3" y="244" text-anchor="middle" font-size="18" font-weight="400" fill="#59636E">begins</text>
<circle class="node n5" cx="757.9" cy="262" r="7" fill="#4F46E5"/>
<text x="757.9" y="294" text-anchor="middle" font-size="20" font-weight="600" fill="#4F46E5">2024</text>
<text x="757.9" y="319" text-anchor="middle" font-size="18" font-weight="500" fill="#1F2328">Assistant</text>
<text x="757.9" y="342" text-anchor="middle" font-size="18" font-weight="400" fill="#59636E">Manager</text>
<circle class="node n6" cx="871.4" cy="262" r="7" fill="#4F46E5"/>
<text x="871.4" y="196" text-anchor="middle" font-size="20" font-weight="600" fill="#4F46E5">2025</text>
<text x="871.4" y="221" text-anchor="middle" font-size="18" font-weight="500" fill="#1F2328">MSc Software Eng.</text>
<text x="871.4" y="244" text-anchor="middle" font-size="18" font-weight="400" fill="#59636E">Kingston Univ.</text>
<circle class="node n7" cx="985.0" cy="262" r="7" fill="#9A6700" filter="url(#nodeglow)"/>
<circle class="pul" cx="985.0" cy="262" r="7" fill="none" stroke="#9A6700" stroke-width="2"/>
<text x="985.0" y="294" text-anchor="middle" font-size="20" font-weight="600" fill="#9A6700">2026</text>
<text x="985.0" y="319" text-anchor="middle" font-size="18" font-weight="500" fill="#1F2328">AI &amp; software</text>
<text x="985.0" y="342" text-anchor="middle" font-size="18" font-weight="400" fill="#59636E">architect</text>
</svg>
