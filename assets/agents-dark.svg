<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="440" viewBox="0 0 1200 440" role="img" aria-label="How I build agents: models, tooling and practice">
<title>How I build agents: models, tooling and practice</title>
<style>
text{font-family:Inter, 'Segoe UI', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif;}
.mono{font-family:ui-monospace, 'SF Mono', SFMono-Regular, Menlo, Consolas, 'DejaVu Sans Mono', monospace;}
*{transform-box:fill-box;}

.flow{stroke-dasharray:3 7;animation:flow 1.6s linear infinite;}
@keyframes flow{to{stroke-dashoffset:-20}}
.ring{animation:ring 3s ease-out infinite;transform-origin:center;}
.ring2{animation-delay:1.5s;}
@keyframes ring{0%{transform:scale(1);opacity:.7}100%{transform:scale(2.1);opacity:0}}
.bob{animation:bob 5s ease-in-out infinite alternate;}
@keyframes bob{from{transform:translateY(-3px)}to{transform:translateY(3px)}}
.spin{animation:spin 30s linear infinite;transform-origin:center;}
@keyframes spin{to{transform:rotate(360deg)}}
.rise{animation:rise .8s ease-out both;}
@keyframes rise{from{opacity:0;transform:translateY(10px)}}

@media (prefers-reduced-motion: reduce){*{animation:none!important;}}
</style>
