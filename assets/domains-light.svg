<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="440" viewBox="0 0 1200 440" role="img" aria-label="Four domains I know from the inside: print and packaging, e-learning, workflows and creative tech">
<title>Four domains I know from the inside: print and packaging, e-learning, workflows and creative tech</title>
<defs>
<clipPath id="tile"><rect x="0" y="0" width="1200" height="440" rx="28"/></clipPath>
<filter id="blur" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="80"/></filter>
<filter id="bloom" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="6"/></filter>
<filter id="shadow" x="-20%" y="-20%" width="140%" height="160%"><feDropShadow dx="0" dy="14" stdDeviation="20" flood-color="#000000" flood-opacity=".12"/></filter>
<linearGradient id="depth" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FFFFFF" stop-opacity=".10"/><stop offset=".4" stop-color="#FFFFFF" stop-opacity="0"/></linearGradient>
<linearGradient id="rim" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FFFFFF" stop-opacity=".85"/><stop offset="1" stop-color="#FFFFFF" stop-opacity=".25"/></linearGradient>
<linearGradient id="ring" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#4F46E5" stop-opacity=".9"/><stop offset="1" stop-color="#9A6700" stop-opacity=".9"/></linearGradient>
</defs>
<style>text{font-family:-apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "Helvetica Neue", "Segoe UI", Inter, Arial, sans-serif;}.blob{transform-box:fill-box;transform-origin:center}.blob-i{animation:drift1 26s ease-in-out infinite alternate}.blob-a{animation:drift2 30s ease-in-out infinite alternate;animation-delay:-11s}@keyframes drift1{from{transform:translate(0,0)}to{transform:translate(52px,38px)}}@keyframes drift2{from{transform:translate(0,0)}to{transform:translate(-46px,-50px)}}.runner{transform-box:fill-box;transform-origin:center;stroke-linecap:round;stroke-dasharray:90 971.84;stroke-dashoffset:90;animation:run 9s linear infinite}@keyframes run{from{stroke-dashoffset:90}to{stroke-dashoffset:-971.84}}@media (prefers-reduced-motion: reduce){*{animation:none!important}}</style>
<rect x="0.5" y="0.5" width="1199" height="439" rx="28" fill="#FFFFFF" stroke="#D0D7DE" stroke-width="1"/>
<g clip-path="url(#tile)" filter="url(#blur)">
<circle class="blob blob-i" cx="190" cy="110" r="330" fill="#312E81" fill-opacity=".30"/>
<circle class="blob blob-a" cx="1060" cy="420" r="300" fill="#BF8700" fill-opacity=".32"/>
</g>
<text x="600" y="92" text-anchor="middle" font-size="48" font-weight="600" letter-spacing="-1.2" fill="#1F2328">Four domains I know from the inside.</text>
<rect x="80" y="140" width="242" height="268" rx="28" fill="#F6F8FA" fill-opacity=".62" filter="url(#shadow)"/>
<rect x="80" y="140" width="242" height="268" rx="28" fill="url(#depth)"/>
<rect x="80" y="140" width="242" height="268" rx="28" fill="none" stroke="url(#rim)" stroke-width="1.25"/>
<g transform="translate(108,168)" fill="none" stroke="#4F46E5" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M8 11V5.5A1.5 1.5 0 0 1 9.5 4h13A1.5 1.5 0 0 1 24 5.5V11"/><rect x="3" y="11" width="26" height="11" rx="2.5"/><path d="M8 22v6h16v-6M8 17h3"/></g>
<text x="108" y="240" font-size="26" font-weight="600" letter-spacing="-0.3" fill="#1F2328">Print &amp;</text>
<text x="108" y="270" font-size="26" font-weight="600" letter-spacing="-0.3" fill="#1F2328">packaging</text>
<text x="108" y="310" font-size="21" font-weight="400" fill="#59636E">Adapting labels,</text>
<text x="108" y="342" font-size="21" font-weight="400" fill="#59636E">prepress checks,</text>
<text x="108" y="374" font-size="21" font-weight="400" fill="#59636E">press-ready PDF.</text>
<rect x="346" y="140" width="242" height="268" rx="28" fill="#F6F8FA" fill-opacity=".62" filter="url(#shadow)"/>
<rect x="346" y="140" width="242" height="268" rx="28" fill="url(#depth)"/>
<rect x="346" y="140" width="242" height="268" rx="28" fill="none" stroke="url(#rim)" stroke-width="1.25"/>
<g transform="translate(374,168)" fill="none" stroke="#4F46E5" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="26" height="17" rx="2.5"/><path d="M13.5 10v7l6-3.5zM10 27h12"/></g>
<text x="374" y="240" font-size="26" font-weight="600" letter-spacing="-0.3" fill="#1F2328">E-learning</text>
<text x="374" y="280" font-size="21" font-weight="400" fill="#59636E">LMS platforms,</text>
<text x="374" y="312" font-size="21" font-weight="400" fill="#59636E">SCORM packaging,</text>
<text x="374" y="344" font-size="21" font-weight="400" fill="#59636E">secure video,</text>
<text x="374" y="376" font-size="21" font-weight="400" fill="#59636E">authoring tools.</text>
<rect x="612" y="140" width="242" height="268" rx="28" fill="#F6F8FA" fill-opacity=".62" filter="url(#shadow)"/>
<rect x="612" y="140" width="242" height="268" rx="28" fill="url(#depth)"/>
<rect x="612" y="140" width="242" height="268" rx="28" fill="none" stroke="url(#rim)" stroke-width="1.25"/>
<g transform="translate(640,168)" fill="none" stroke="#4F46E5" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><circle cx="6" cy="16" r="3.25"/><circle cx="26" cy="7" r="3.25"/><circle cx="26" cy="25" r="3.25"/><path d="M9 14.5l14-6M9 17.5l14 6"/></g>
<text x="640" y="240" font-size="26" font-weight="600" letter-spacing="-0.3" fill="#1F2328">Workflows</text>
<text x="640" y="280" font-size="21" font-weight="400" fill="#59636E">Approvals, SAP</text>
<text x="640" y="312" font-size="21" font-weight="400" fill="#59636E">and ERP links,</text>
<text x="640" y="344" font-size="21" font-weight="400" fill="#59636E">document AI,</text>
<text x="640" y="376" font-size="21" font-weight="400" fill="#59636E">billing systems.</text>
<rect x="878" y="140" width="242" height="268" rx="28" fill="#F6F8FA" fill-opacity=".62" filter="url(#shadow)"/>
<rect x="878" y="140" width="242" height="268" rx="28" fill="url(#depth)"/>
<rect x="878" y="140" width="242" height="268" rx="28" fill="none" stroke="url(#ring)" stroke-width="6" stroke-opacity=".18" filter="url(#bloom)"/>
<rect x="878" y="140" width="242" height="268" rx="28" fill="none" stroke="url(#ring)" stroke-width="1.75"/>
<rect class="runner" x="878" y="140" width="242" height="268" rx="28" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-opacity=".9"/>
<g transform="translate(906,168)" fill="none" stroke="#9A6700" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M16 3l12 6.5v13L16 29 4 22.5v-13z"/><path d="M4 9.5l12 6.5 12-6.5M16 16v13"/></g>
<text x="906" y="240" font-size="26" font-weight="600" letter-spacing="-0.3" fill="#1F2328">Creative tech</text>
<text x="906" y="280" font-size="21" font-weight="400" fill="#59636E">3D in Dimension</text>
<text x="906" y="312" font-size="21" font-weight="400" fill="#59636E">and Substance 3D</text>
<text x="906" y="344" font-size="21" font-weight="400" fill="#59636E">Stager, motion,</text>
<text x="906" y="376" font-size="21" font-weight="400" fill="#59636E">UI/UX, plugins.</text>
</svg>
