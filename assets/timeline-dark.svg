<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-label="Career timeline 2012 to 2026">
<title>Career timeline 2012 to 2026</title>
<style>
text{font-family:Inter, 'Segoe UI', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif;}
.mono{font-family:ui-monospace, 'SF Mono', SFMono-Regular, Menlo, Consolas, 'DejaVu Sans Mono', monospace;}
*{transform-box:fill-box;}

.draw{stroke-dasharray:100;animation:draw 3.5s cubic-bezier(.6,0,.2,1) .3s both;}
@keyframes draw{from{stroke-dashoffset:100}}
.pop{animation:pop .6s cubic-bezier(.3,1.6,.5,1) both;transform-origin:center;}
@keyframes pop{from{opacity:0;transform:scale(0)}}
.fadein{animation:fadein .6s ease both;}
@keyframes fadein{from{opacity:0;transform:translateY(6px)}}
.now{animation:now 2s ease-out infinite;transform-origin:center;}
@keyframes now{0%{transform:scale(1);opacity:.8}100%{transform:scale(3);opacity:0}}

@media (prefers-reduced-motion: reduce){*{animation:none!important;}}
</style>
<rect x="0.5" y="0.5" width="1199" height="359" rx="20" fill="#0A0D13" stroke="#232B38"/>

<text class="mono" x="80" y="78" font-size="12" letter-spacing="2.4" fill="#8B7CFF">FOURTEEN YEARS, ONE THREAD</text>
<text x="78" y="116" font-size="28" font-weight="800" letter-spacing="-.8" fill="#EEF1F6">From building courseware to building agents.</text>
