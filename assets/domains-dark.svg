<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-label="Applied to Print and Packaging, E-Learning, Workflows and Creative Tech">
<title>Applied to Print and Packaging, E-Learning, Workflows and Creative Tech</title>
<style>
text{font-family:Inter, 'Segoe UI', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif;}
.mono{font-family:ui-monospace, 'SF Mono', SFMono-Regular, Menlo, Consolas, 'DejaVu Sans Mono', monospace;}
*{transform-box:fill-box;}

.cut2{stroke-dasharray:100;animation:cut2 6s ease-in-out infinite both;}
@keyframes cut2{0%{stroke-dashoffset:100}40%,90%{stroke-dashoffset:0}100%{stroke-dashoffset:100}}
.fill2{animation:fill2 6s ease infinite both;}
@keyframes fill2{0%,35%{opacity:0}50%,90%{opacity:1}100%{opacity:0}}
.bar2{transform-origin:0 50%;animation:bar2 5s linear infinite both;}
@keyframes bar2{from{transform:scaleX(0)}to{transform:scaleX(1)}}
.flow{stroke-dasharray:3 6;animation:flow 1.2s linear infinite;}
@keyframes flow{to{stroke-dashoffset:-9}}
.hop{animation:hop 4.5s cubic-bezier(.7,0,.3,1) infinite both;}
@keyframes hop{0%,12%{transform:translateX(0)}38%,50%{transform:translateX(66px)}76%,100%{transform:translateX(132px)}}
.spin3{animation:spin3 3s ease-in-out infinite alternate;}
@keyframes spin3{from{transform:translateY(-3px)}to{transform:translateY(3px)}}
.face{animation:face 6s ease-in-out infinite;}
@keyframes face{0%,100%{fill-opacity:.15}50%{fill-opacity:.6}}
.head{animation:head 4s linear infinite;}
@keyframes head{from{transform:translateX(0)}to{transform:translateX(150px)}}
.tile{animation:tile .8s ease-out both;}
@keyframes tile{from{opacity:0;transform:translateY(12px)}}

@media (prefers-reduced-motion: reduce){*{animation:none!important;}}
</style>
<rect x="0.5" y="0.5" width="1199" height="359" rx="20" fill="#0A0D13" stroke="#232B38"/>

