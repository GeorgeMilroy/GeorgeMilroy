<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="400" viewBox="0 0 1200 400" role="img" aria-label="RangeXT — AI assistant in Adobe Illustrator for packaging artwork">
<title>RangeXT — AI assistant in Adobe Illustrator for packaging artwork</title>
<style>
text{font-family:Inter, 'Segoe UI', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif;}
.mono{font-family:ui-monospace, 'SF Mono', SFMono-Regular, Menlo, Consolas, 'DejaVu Sans Mono', monospace;}
*{transform-box:fill-box;}

.rise{animation:rise .8s ease-out both;}
@keyframes rise{from{opacity:0;transform:translateY(10px)}}
.shine{animation:shine 4s ease-in-out infinite;}
@keyframes shine{0%,60%{transform:translateX(-120px)}100%{transform:translateX(320px)}}

.rp{transform-origin:0 50%;animation:rp 10s steps(42,end) infinite both;}
@keyframes rp{0%{transform:scaleX(0)}28%,92%{transform:scaleX(1)}100%{transform:scaleX(0)}}
.lab{transform-origin:center;animation:lab 10s cubic-bezier(.7,0,.2,1) infinite both;}
@keyframes lab{0%,32%{transform:scale(.82,.8)}44%,92%{transform:none}100%{transform:scale(.82,.8)}}
.ara{transform-origin:right center;animation:ara 10s ease infinite both;}
@keyframes ara{0%,42%{transform:scaleX(0)}50%,92%{transform:none}100%{transform:scaleX(0)}}
.bcd{transform-origin:center bottom;animation:bcd 10s ease infinite both;}
@keyframes bcd{0%,44%{transform:scaleY(0)}52%,92%{transform:none}100%{transform:scaleY(0)}}
.chk{animation:chk 10s ease infinite both;}
@keyframes chk{0%,50%{opacity:0;transform:scale(.4)}54%,92%{opacity:1;transform:none}100%{opacity:0}}
.s1{opacity:0;animation:s1 10s ease infinite both;} .s2{animation:s2 10s ease infinite both;}
@keyframes s1{0%,40%{opacity:1}44%,96%{opacity:0}100%{opacity:1}}
@keyframes s2{0%,42%{opacity:0}46%,92%{opacity:1}100%{opacity:0}}
.selbox{stroke-dasharray:4 3;animation:ants .8s linear infinite;}
@keyframes ants{to{stroke-dashoffset:-7}}

@media (prefers-reduced-motion: reduce){*{animation:none!important;}}
</style>
