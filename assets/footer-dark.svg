<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="280" viewBox="0 0 1200 280" role="img" aria-label="Have a process an agent should run? Get in touch.">
<title>Have a process an agent should run? Get in touch.</title>
<style>
text{font-family:Inter, 'Segoe UI', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif;}
.mono{font-family:ui-monospace, 'SF Mono', SFMono-Regular, Menlo, Consolas, 'DejaVu Sans Mono', monospace;}
*{transform-box:fill-box;}

.regC{animation:regC 9s ease-in-out infinite both;} .regM{animation:regM 9s ease-in-out infinite both;}
.regY{animation:regY 9s ease-in-out infinite both;} .regK{animation:regK 9s ease-in-out infinite both;}
@keyframes regC{0%,8%{transform:translate(-5px,3px);opacity:.9}30%,86%{transform:none;opacity:0}100%{transform:translate(-5px,3px);opacity:.9}}
@keyframes regM{0%,8%{transform:translate(4px,-4px);opacity:.9}30%,86%{transform:none;opacity:0}100%{transform:translate(4px,-4px);opacity:.9}}
@keyframes regY{0%,8%{transform:translate(3px,5px);opacity:.9}30%,86%{transform:none;opacity:0}100%{transform:translate(3px,5px);opacity:.9}}
@keyframes regK{0%,100%{opacity:1}}

.stamp{animation:stamp 1s cubic-bezier(.3,1.4,.5,1) both;transform-origin:center;}
@keyframes stamp{from{opacity:0;transform:scale(.6)}}
.pulse2{animation:pulse2 2s ease-out infinite;transform-origin:center;}
@keyframes pulse2{0%{transform:scale(1);opacity:.8}100%{transform:scale(3);opacity:0}}
.scan{animation:scan 7s cubic-bezier(.45,0,.55,1) infinite alternate both;}
@keyframes scan{0%{transform:translateX(0)}100%{transform:translateX(1032px)}}

@media (prefers-reduced-motion: reduce){*{animation:none!important;}}
</style>
<rect x="0.5" y="0.5" width="1199" height="279" rx="20" fill="#0A0D13" stroke="#232B38"/>


<text class="mono" x="80" y="88" font-size="12" letter-spacing="2.4" fill="#8B7CFF">GET IN TOUCH</text>
<text x="78" y="138" font-size="42" font-weight="800" letter-spacing="-1.4" fill="#EEF1F6">Have a process an agent should run?</text>
<text x="80" y="174" font-size="17" fill="#97A0B0">I design, build and ship the agent — and stay for production.</text>
<g transform="translate(980,136)"><g class="stamp">
<rect x="-104" y="-26" width="208" height="52" rx="26" fill="#3DDC97" fill-opacity=".12" stroke="#3DDC97" stroke-width="1.5"/>
<circle class="pulse2" cx="-80" cy="0" r="5" fill="#3DDC97"/><circle cx="-80" cy="0" r="5" fill="#3DDC97"/>
<text class="mono" x="8" y="5" text-anchor="middle" font-size="13" font-weight="700" letter-spacing="2" fill="#3DDC97">OPEN TO COLLAB</text>
</g></g>
<defs><linearGradient id="sig" x1="0" x2="1"><stop offset="0" stop-color="#2DD4BF"/><stop offset=".35" stop-color="#FB7185"/><stop offset=".7" stop-color="#F5B041"/><stop offset="1" stop-color="#8B7CFF"/></linearGradient></defs><rect x="80" y="218.0" width="1040" height="3" rx="1.5" fill="url(#sig)" fill-opacity=".9"/>
<g class="scan"><circle cx="80" cy="219.5" r="5" fill="#EEF1F6"/><circle cx="80" cy="219.5" r="9" fill="none" stroke="#EEF1F6" stroke-opacity=".35"/></g>
<text class="mono" x="80" y="246" font-size="9.5" letter-spacing="1.5" fill="#4B5566">DUBAI · GMT+4 · REPLIES WITHIN A DAY</text>
<text class="mono" x="1120" y="246" text-anchor="end" font-size="9.5" letter-spacing="1.5" fill="#4B5566">MILROYENTERTAINMENT@GMAIL.COM</text>
</svg>