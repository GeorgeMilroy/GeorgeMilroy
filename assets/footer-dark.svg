<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-label="Have a process an agent should run? I design, build and ship the agent and stay for production. Get in touch.">
<title>Have a process an agent should run? I design, build and ship the agent and stay for production. Get in touch.</title>
<style>text{font-family:-apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "Helvetica Neue", "Segoe UI", Inter, Arial, sans-serif;}
.blob{transform-box:fill-box;transform-origin:center}
.b1{animation:drift1 26s ease-in-out infinite alternate}
.b2{animation:drift2 30s ease-in-out infinite alternate;animation-delay:-11s}
.b3{animation:drift3 22s ease-in-out infinite alternate;animation-delay:-5s}
@keyframes drift1{from{transform:translate(0,0)}to{transform:translate(52px,36px)}}
@keyframes drift2{from{transform:translate(0,0)}to{transform:translate(-56px,-40px)}}
@keyframes drift3{from{transform:translate(0,0)}to{transform:translate(-40px,-24px)}}
.runner{transform-box:fill-box;transform-origin:center;stroke-linecap:round;stroke-dasharray:90 470.72;stroke-dashoffset:90;animation:run 9s linear infinite}
@keyframes run{from{stroke-dashoffset:90}to{stroke-dashoffset:-560.72}}
@media (prefers-reduced-motion: reduce){*{animation:none!important}}
</style>
<defs>
  <clipPath id="canvas"><rect x="0" y="0" width="1200" height="300" rx="28"/></clipPath>
  <filter id="blur" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="80"/></filter>
  <filter id="shadow" x="-10%" y="-40%" width="120%" height="180%"><feDropShadow dx="0" dy="14" stdDeviation="20" flood-color="#000000" flood-opacity=".55"/></filter>
  <filter id="bloom" x="-20%" y="-60%" width="140%" height="220%"><feGaussianBlur stdDeviation="6"/></filter>
  <linearGradient id="depth" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#FFFFFF" stop-opacity=".06"/>
    <stop offset=".4" stop-color="#FFFFFF" stop-opacity="0"/>
  </linearGradient>
  <linearGradient id="rim" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#FFFFFF" stop-opacity=".32"/>
    <stop offset="1" stop-color="#FFFFFF" stop-opacity=".06"/>
  </linearGradient>
  <linearGradient id="ring" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#A5B4FC" stop-opacity=".9"/>
    <stop offset="1" stop-color="#D29922" stop-opacity=".9"/>
  </linearGradient>
</defs>

<!-- Canvas tile -->
<rect x="0.5" y="0.5" width="1199" height="299" rx="28" fill="#0D1117" stroke="#30363D" stroke-width="1"/>

<!-- Backdrop blobs: indigo upper-left, amber lower-right, small indigo under the CTA (clipped) -->
<g clip-path="url(#canvas)">
  <circle class="blob b1" cx="190" cy="30" r="320" fill="#4F46E5" fill-opacity=".56" filter="url(#blur)"/>
  <circle class="blob b2" cx="1010" cy="290" r="300" fill="#9E6A03" fill-opacity=".62" filter="url(#blur)"/>
  <circle class="blob b3" cx="600" cy="200" r="160" fill="#4F46E5" fill-opacity=".28" filter="url(#blur)"/>
</g>

<!-- Glass panel: base + depth sheen + rim, outer shadow -->
<rect x="80" y="28" width="1040" height="238" rx="28" fill="#161B22" fill-opacity=".72" filter="url(#shadow)"/>
<rect x="80" y="28" width="1040" height="238" rx="28" fill="url(#depth)"/>
<rect x="80" y="28" width="1040" height="238" rx="28" fill="none" stroke="url(#rim)" stroke-width="1.25"/>

<!-- Headline + sub-line (centered) -->
<text x="600" y="94" text-anchor="middle" font-size="48" font-weight="600" letter-spacing="-1.2" fill="#F0F6FC">Have a process an agent should run?</text>
<text x="600" y="136" text-anchor="middle" font-size="21" font-weight="400" fill="#9198A1">I design, build and ship the agent — and stay for production.</text>

<!-- CTA capsule: the asset's single ring-light element (bloom beneath, crisp ring on top) -->
<rect x="496.0" y="158" width="208" height="48" rx="24" fill="#161B22" fill-opacity=".80"/>
<rect x="496.0" y="158" width="208" height="48" rx="24" fill="url(#depth)"/>
<rect x="496.0" y="158" width="208" height="48" rx="24" fill="none" stroke="url(#ring)" stroke-width="6" stroke-opacity=".18" filter="url(#bloom)"/>
<rect x="496.0" y="158" width="208" height="48" rx="24" fill="none" stroke="url(#ring)" stroke-width="1.75"/>
<rect class="runner" x="496.0" y="158" width="208" height="48" rx="24" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-opacity=".9"/>
<text x="600" y="189" text-anchor="middle" font-size="20" font-weight="600" fill="#D29922">Get in touch ›</text>

<!-- Hairline + meta row -->
<line x1="112" y1="224.5" x2="1088" y2="224.5" stroke="#30363D" stroke-width="1" stroke-opacity="1"/>
<text x="1088" y="250" text-anchor="end" font-size="18" font-weight="500" fill="#6E7681">milroyentertainment@gmail.com</text>
</svg>
