<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="440" viewBox="0 0 1200 440" role="img" aria-label="PPM Workflow — print production management for offset and flexo plates, with AI invoice extraction matched against SAP purchase orders">
<title>PPM Workflow — print production management for offset and flexo plates, with AI invoice extraction matched against SAP purchase orders</title>
<style>text{font-family:-apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "Helvetica Neue", "Segoe UI", Inter, Arial, sans-serif;}.b1,.b2,.b3,.pop,.pulse{transform-box:fill-box;transform-origin:center;}.b1{animation:drift1 26s ease-in-out infinite alternate;}.b2{animation:drift2 30s ease-in-out infinite alternate;animation-delay:-11s;}.b3{animation:drift3 22s ease-in-out infinite alternate;animation-delay:-6s;}.run{stroke-dasharray:90 1631.84;stroke-dashoffset:90;stroke-linecap:round;animation:run 9s linear infinite;}.pop{animation:pop .5s ease-out both;}.draw{animation:draw 1.6s ease-out both;}.pulse{animation:pulse 2.8s ease-out infinite;animation-delay:2.1s;}@keyframes drift1{to{transform:translate(50px,36px);}}@keyframes drift2{to{transform:translate(-44px,-52px);}}@keyframes drift3{to{transform:translate(40px,-30px);}}@keyframes run{to{stroke-dashoffset:-1631.84;}}@keyframes pop{from{transform:scale(.4);opacity:0;}to{transform:scale(1);opacity:1;}}@keyframes draw{to{stroke-dashoffset:0;}}@keyframes pulse{from{transform:scale(1);opacity:.7;}to{transform:scale(2.4);opacity:0;}}@media (prefers-reduced-motion: reduce){*{animation:none !important;}.draw{stroke-dashoffset:0 !important;}}</style>
