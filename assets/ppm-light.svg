<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="400" viewBox="0 0 1200 400" role="img" aria-label="PPM Workflow — print production management with AI invoice matching">
<title>PPM Workflow — print production management with AI invoice matching</title>
<style>
text{font-family:Inter, 'Segoe UI', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif;}
.mono{font-family:ui-monospace, 'SF Mono', SFMono-Regular, Menlo, Consolas, 'DejaVu Sans Mono', monospace;}
*{transform-box:fill-box;}

.rise{animation:rise .8s ease-out both;}
@keyframes rise{from{opacity:0;transform:translateY(10px)}}
.shine{animation:shine 4s ease-in-out infinite;}
@keyframes shine{0%,60%{transform:translateX(-120px)}100%{transform:translateX(320px)}}

.job{animation:job 10s cubic-bezier(.7,0,.25,1) infinite both;}
@keyframes job{0%,10%{transform:translateX(0)}18%,28%{transform:translateX(92px)}36%,46%{transform:translateX(184px)}54%,64%{transform:translateX(276px)}72%,96%{transform:translateX(368px)}100%{transform:translateX(0)}}
.lit{animation:lit 10s ease infinite both;}
@keyframes lit{0%{fill-opacity:0}3%,92%{fill-opacity:1}98%,100%{fill-opacity:0}}
.prog{transform-origin:0 50%;animation:prog 10s cubic-bezier(.7,0,.25,1) infinite both;}
@keyframes prog{0%,10%{transform:scaleX(0)}18%,28%{transform:scaleX(.25)}36%,46%{transform:scaleX(.5)}54%,64%{transform:scaleX(.75)}72%,96%{transform:scaleX(1)}100%{transform:scaleX(0)}}
.scanl{animation:scanl 3.2s ease-in-out infinite alternate;}
@keyframes scanl{from{transform:translateY(0)}to{transform:translateY(112px)}}
.ocr{animation:ocr 6s ease infinite both;}
@keyframes ocr{0%{opacity:0}8%,85%{opacity:1}100%{opacity:0}}
.row{animation:row 6s ease infinite both;}
@keyframes row{0%,20%{opacity:0;transform:translateX(-6px)}28%,88%{opacity:1;transform:none}100%{opacity:0}}
.match{animation:match 6s ease infinite both;transform-origin:center;}
@keyframes match{0%,62%{opacity:0;transform:scale(.8)}70%,92%{opacity:1;transform:none}100%{opacity:0}}
.flowx{stroke-dasharray:4 5;animation:flowx 1s linear infinite;}
@keyframes flowx{to{stroke-dashoffset:-9}}
@keyframes lit_0{0%,2%{fill-opacity:0}4%,94%{fill-opacity:1}98%,100%{fill-opacity:0}}
.lit_0{animation:lit_0 10s ease infinite both;}
@keyframes lit_1{0%,20%{fill-opacity:0}22%,94%{fill-opacity:1}98%,100%{fill-opacity:0}}
.lit_1{animation:lit_1 10s ease infinite both;}
@keyframes lit_2{0%,38%{fill-opacity:0}40%,94%{fill-opacity:1}98%,100%{fill-opacity:0}}
.lit_2{animation:lit_2 10s ease infinite both;}
@keyframes lit_3{0%,56%{fill-opacity:0}58%,94%{fill-opacity:1}98%,100%{fill-opacity:0}}
.lit_3{animation:lit_3 10s ease infinite both;}
@keyframes lit_4{0%,74%{fill-opacity:0}76%,94%{fill-opacity:1}98%,100%{fill-opacity:0}}
.lit_4{animation:lit_4 10s ease infinite both;}

@media (prefers-reduced-motion: reduce){*{animation:none!important;}}
</style>
