<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="444" viewBox="0 0 1200 444" role="img" aria-label="George Milroy Devadasan — AI and software architect. I architect and ship complete systems — product, platform, and the AI agents inside them — for print and packaging, e-learning, workflows and creative tech.">
<title>George Milroy Devadasan — AI and software architect. I architect and ship complete systems — product, platform, and the AI agents inside them — for print and packaging, e-learning, workflows and creative tech.</title>
<defs>
<clipPath id="tile"><rect x="0" y="0" width="1200" height="444" rx="28"/></clipPath>
<clipPath id="hero"><rect x="80" y="48" width="1040" height="348" rx="28"/></clipPath>
<linearGradient id="sheen" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#FFFFFF" stop-opacity="0"/><stop offset=".5" stop-color="#FFFFFF" stop-opacity=".12"/><stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/></linearGradient>
<filter id="blur" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="80"/></filter>
<filter id="shadow" x="-10%" y="-20%" width="120%" height="150%"><feDropShadow dx="0" dy="14" stdDeviation="20" flood-color="#000000" flood-opacity=".12"/></filter>
<filter id="bloom" x="-5%" y="-10%" width="110%" height="120%"><feGaussianBlur stdDeviation="6"/></filter>
<linearGradient id="depth" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FFFFFF" stop-opacity=".10"/><stop offset=".4" stop-color="#FFFFFF" stop-opacity="0"/></linearGradient>
<linearGradient id="chiprim" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FFFFFF" stop-opacity=".7"/><stop offset="1" stop-color="#FFFFFF" stop-opacity=".2"/></linearGradient>
<linearGradient id="ring" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#4F46E5" stop-opacity=".9"/><stop offset="1" stop-color="#9A6700" stop-opacity=".9"/></linearGradient>
</defs>
<style>text{font-family:-apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "Helvetica Neue", "Segoe UI", Inter, Arial, sans-serif;}.blob{transform-box:fill-box;transform-origin:center;}.b1{animation:drift1 26s ease-in-out infinite alternate;}.b2{animation:drift2 30s ease-in-out infinite alternate;animation-delay:-9s;}.b3{animation:drift3 22s ease-in-out infinite alternate;}@keyframes drift1{from{transform:translate(0,0)}to{transform:translate(52px,44px)}}@keyframes drift2{from{transform:translate(0,0)}to{transform:translate(-56px,-42px)}}@keyframes drift3{from{transform:translate(0,0)}to{transform:translate(40px,-36px)}}.runner{transform-box:fill-box;transform-origin:center;stroke-linecap:round;stroke-dasharray:90 2727.84;stroke-dashoffset:90;animation:run 9s linear infinite;}@keyframes run{from{stroke-dashoffset:90}to{stroke-dashoffset:-2817.84}}.sheen{transform-box:fill-box;transform-origin:center;animation:sheen 11s ease-in-out infinite;}@keyframes sheen{0%{transform:translateX(0) skewX(-20deg)}23%{transform:translateX(1640px) skewX(-20deg)}100%{transform:translateX(1640px) skewX(-20deg)}}@media (prefers-reduced-motion:reduce){*{animation:none!important;}}</style>
