<style>text{font-family:-apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "Helvetica Neue", "Segoe UI", Inter, Arial, sans-serif;}.b1,.b2,.b3,.run,.pulse{transform-box:fill-box;transform-origin:center}.b1{animation:drift1 26s ease-in-out infinite alternate}.b2{animation:drift2 30s ease-in-out -9s infinite alternate}.b3{animation:drift3 22s ease-in-out -15s infinite alternate}.run{animation:run 9s linear infinite}.pulse{animation:pulse 2.8s ease-out infinite}@keyframes drift1{to{transform:translate(52px,38px)}}@keyframes drift2{to{transform:translate(-48px,-44px)}}@keyframes drift3{to{transform:translate(40px,-30px)}}@keyframes run{from{stroke-dashoffset:90}to{stroke-dashoffset:var(--p)}}@keyframes pulse{0%{transform:scale(1);opacity:.7}100%{transform:scale(2.4);opacity:0}}@media (prefers-reduced-motion: reduce){*{animation:none!important}}</style>
