<style>text{font-family:-apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "Helvetica Neue", "Segoe UI", Inter, Arial, sans-serif;}.blob{transform-box:fill-box;transform-origin:center;}.b1{animation:drift1 26s ease-in-out infinite alternate;}.b2{animation:drift2 30s ease-in-out infinite alternate;animation-delay:-9s;}@keyframes drift1{from{transform:translate(0,0)}to{transform:translate(52px,36px)}}@keyframes drift2{from{transform:translate(0,0)}to{transform:translate(-56px,-40px)}}.glow{transform-box:fill-box;transform-origin:center;opacity:.6;animation:glow 6s ease-in-out infinite;}@keyframes glow{0%,35%{opacity:.6}46%{opacity:1}62%{opacity:.75}79%{opacity:1}93%,100%{opacity:.6}}.d{transform-box:fill-box;transform-origin:center;opacity:0;}.d0{animation:h0 6s linear infinite;}@keyframes h0{0%{opacity:0;transform:translateY(0px)}13.5%{opacity:0;transform:translateY(0px)}16.5%{opacity:1;transform:translateY(7.5px)}26.5%{opacity:1;transform:translateY(32.5px)}29.5%{opacity:0;transform:translateY(40px)}100%{opacity:0;transform:translateY(40px)}}.d1{animation:h1 6s linear infinite;}@keyframes h1{0%{opacity:0;transform:translateY(0px)}29.5%{opacity:0;transform:translateY(0px)}32.5%{opacity:1;transform:translateY(7.5px)}42.5%{opacity:1;transform:translateY(32.5px)}45.5%{opacity:0;transform:translateY(40px)}100%{opacity:0;transform:translateY(40px)}}.d2{animation:h2 6s linear infinite;}@keyframes h2{0%{opacity:0;transform:translateY(0px)}45.5%{opacity:0;transform:translateY(0px)}48.5%{opacity:1;transform:translateY(7.5px)}58.5%{opacity:1;transform:translateY(32.5px)}61.5%{opacity:0;transform:translateY(40px)}100%{opacity:0;transform:translateY(40px)}}.d3{animation:h3 6s linear infinite;}@keyframes h3{0%{opacity:0;transform:translateY(0px)}61.5%{opacity:0;transform:translateY(0px)}64.5%{opacity:1;transform:translateY(-7.5px)}74.5%{opacity:1;transform:translateY(-32.5px)}77.5%{opacity:0;transform:translateY(-40px)}100%{opacity:0;transform:translateY(-40px)}}.d4{animation:h4 6s linear infinite;}@keyframes h4{0%{opacity:0;transform:translateY(0px)}77.5%{opacity:0;transform:translateY(0px)}80.5%{opacity:1;transform:translateY(-7.5px)}90.5%{opacity:1;transform:translateY(-32.5px)}93.5%{opacity:0;transform:translateY(-40px)}100%{opacity:0;transform:translateY(-40px)}}.d5{animation:h5 6s linear infinite;}@keyframes h5{0%{opacity:1;transform:translateY(-16.2px)}6.5%{opacity:1;transform:translateY(-32.5px)}9.5%{opacity:0;transform:translateY(-40px)}93.5%{opacity:0;transform:translateY(0px)}96.5%{opacity:1;transform:translateY(-7.5px)}100%{opacity:1;transform:translateY(-16.2px)}}@media (prefers-reduced-motion:reduce){*{animation:none!important;}}</style>
