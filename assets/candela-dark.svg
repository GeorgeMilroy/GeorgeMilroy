<style>text{font-family:-apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "Helvetica Neue", "Segoe UI", Inter, Arial, sans-serif;}.b1,.b2,.b3,.run{transform-box:fill-box;transform-origin:center;}.b1{animation:drift1 26s ease-in-out infinite alternate;}.b2{animation:drift2 30s ease-in-out infinite alternate;animation-delay:-11s;}.b3{animation:drift3 22s ease-in-out infinite alternate;animation-delay:-5s;}@keyframes drift1{to{transform:translate(52px,38px);}}@keyframes drift2{to{transform:translate(-48px,-44px);}}@keyframes drift3{to{transform:translate(36px,-30px);}}.run{stroke-dasharray:90 1631.84;stroke-dashoffset:90;animation:run 9s linear infinite;}@keyframes run{from{stroke-dashoffset:90;}to{stroke-dashoffset:-1721.84;}}@media (prefers-reduced-motion: reduce){*{animation:none !important;}}</style>
