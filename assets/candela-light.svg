<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="400" viewBox="0 0 1200 400" role="img" aria-label="Candela Learning — secure web and Android learning platform">
<title>Candela Learning — secure web and Android learning platform</title>
<style>
text{font-family:Inter, 'Segoe UI', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif;}
.mono{font-family:ui-monospace, 'SF Mono', SFMono-Regular, Menlo, Consolas, 'DejaVu Sans Mono', monospace;}
*{transform-box:fill-box;}

.rise{animation:rise .8s ease-out both;}
@keyframes rise{from{opacity:0;transform:translateY(10px)}}
.shine{animation:shine 4s ease-in-out infinite;}
@keyframes shine{0%,60%{transform:translateX(-120px)}100%{transform:translateX(320px)}}

.seg{animation:none;}
.prog2{transform-origin:0 50%;animation:prog2 6s linear infinite both;}
@keyframes prog2{0%{transform:scaleX(.05)}100%{transform:scaleX(1)}}
.play{animation:play 6s ease infinite;transform-origin:center;}
@keyframes play{0%,100%{transform:scale(1)}50%{transform:scale(1.12)}}
.ringp{stroke-dasharray:100;animation:ringp 4s ease-in-out infinite alternate both;}
@keyframes ringp{from{stroke-dashoffset:90}to{stroke-dashoffset:25}}
.shield{animation:shield 3s ease-in-out infinite;transform-origin:center;}
@keyframes shield{0%,100%{transform:none}50%{transform:translateY(-3px)}}
.wire{stroke-dasharray:3 6;animation:wire 1.2s linear infinite;}
@keyframes wire{to{stroke-dashoffset:-9}}
.up{animation:up 1s ease-out both;}
@keyframes up{from{opacity:0;transform:translateY(8px)}}

@media (prefers-reduced-motion: reduce){*{animation:none!important;}}
</style>
